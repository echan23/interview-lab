name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d ~/interviewlab/.git ]; then
              rm -rf ~/interviewlab
              git clone https://github.com/echan23/interviewlab.git ~/interviewlab
            fi
            cd ~/interviewlab
            git pull origin main
            cd go-backend
            docker-compose build
            docker-compose up -d
