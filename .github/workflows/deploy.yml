name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'go-backend/**'
      - 'docker-compose.yaml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d ~/interviewlab/.git ]; then
              rm -rf ~/interviewlab
              git clone https://github.com/echan23/interviewlab.git ~/interviewlab
            fi
            cd ~/interviewlab
            git pull origin main

            # Copy .env from safe backup location
            cp ~/env-backup/.env ~/interviewlab/go-backend/.env

            # Build and deploy only the go-backend
            cd go-backend
            docker build -t interviewlab-go-backend .
            docker stop interviewlab || true
            docker rm interviewlab || true
            docker run -d --name interviewlab --restart always --env-file .env -p 8080:8080 interviewlab-go-backend
