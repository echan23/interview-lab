name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'go-backend/**'
      - 'docker-compose.yaml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d ~/interviewlab/.git ]; then
              rm -rf ~/interviewlab
              git clone https://github.com/echan23/interviewlab.git ~/interviewlab
            fi
            cd ~/interviewlab
            git pull origin main

            # Copy .env from safe backup location (warn if the backup is gone)
            cp ~/env-backup/.env ~/interviewlab/go-backend/.env || echo "WARNING: ~/env-backup/.env missing, deploying with existing go-backend/.env"

            # Pin a compose version whose build works without a newer buildx plugin
            COMPOSE_VERSION=v2.27.1
            if [ "$(docker compose version --short 2>/dev/null)" != "${COMPOSE_VERSION#v}" ]; then
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -fsSL "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-$(uname -m)" -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi

            # Remove pre-compose containers so their names don't conflict
            docker stop interviewlab piston_api || true
            docker rm interviewlab piston_api || true

            # Build and deploy the full stack (go-backend + piston)
            docker compose up -d --build
